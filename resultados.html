<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resultados de búsqueda | WmaxprinT</title>

    <link rel="icon" type="image/png" href="Img/Logo/Isotipo.png">

    <link rel="stylesheet" href="Css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <header class="top-header">

        <a href="index.html" class="logo">

            <img src="Img/Logo/logo.png" alt="WmaxprinT">

        </a>

        <div class="busqueda">

            <input
                type="search"
                id="buscador"
                placeholder="¿Qué estás buscando?"
                aria-label="Buscar en WmaxPrinT"
            >

            <button
                type="button"
                id="btn-buscar"
                aria-label="Buscar">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>

        <nav class="menu-superior">

            <ul>

                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="quienes-somos.html">¿Quiénes somos?</a>
                </li>

                <li>
                    <a href="contacto.html">Contacto</a>
                </li>

            </ul>

        </nav>

    </header>


  <main class="resultados">

    <div class="encabezado-resultados">
        <h1 id="titulo-resultados"></h1>
        <p id="cantidad-resultados"></p>
    </div>

    <div id="lista-resultados" class="grid-resultados"></div>

</main>


    <script src="Js/buscador.js"></script>

</body>

</html>
